name: nono-setup-node
description: >-
  Installs Node.js via actions/setup-node and shims `node`, `npm` and `yarn` so they
  run inside the nono sandbox (`nono run --profile <profile> -- <cmd> ...`).
author: jcchavezs

inputs:
  nono-version:
    description: nono release tag to install (e.g. v0.69.0). Use "latest" to install the newest release.
    default: v0.69.0
  setup-node-version:
    description: Git ref (tag, branch or SHA) of actions/setup-node to use, e.g. v7.1.0 or a commit SHA. Pinned to a commit SHA by default.
    default: 949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
  node-version:
    description: Version Spec of the version to use. Examples 12.x, 10.15.1, >=10.15.0.
  node-version-file:
    description: File containing the version Spec of the version to use (package.json, .nvmrc, .node-version, .tool-versions).
  architecture:
    description: Target architecture for Node to use. Examples x86, x64. Will use system architecture by default.
  check-latest:
    description: Set this option if you want the action to check for the latest available version that satisfies the version spec.
    default: "false"
  registry-url:
    description: Optional registry to set up for auth. Sets up the .npmrc to publish to this registry.
  scope:
    description: Optional scope for authenticating against scoped registries.
  token:
    description: Used to pull node distributions from node-versions. Since there's a default, this is typically not supplied by the user.
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}
  always-auth:
    description: Set always-auth in npmrc.
    default: "false"
  cache:
    description: Used to specify a package manager for caching in the default directory. Supported values npm, yarn, pnpm.
  package-manager-cache:
    description: Set to false to disable automatic caching based on the package.json `packageManager` field.
    default: "true"
  cache-dependency-path:
    description: Used to specify the path to a dependency file (package-lock.json, yarn.lock, etc.).
  mirror:
    description: Used to specify an alternative mirror to download Node.js binaries from.
  mirror-token:
    description: The token used as Authorization header when fetching from the mirror.
  nono-profile:
    description: >-
      Inline nono profile (JSON). It is written to ${RUNNER_TEMP}/nono-profiles
      and passed to nono with --profile. Mutually exclusive with
      nono-profile-file. Defaults to a built-in "node-ci" profile.
  nono-profile-file:
    description: >-
      Path to a nono profile file (relative to the workspace or absolute),
      passed to nono with --profile. Mutually exclusive with nono-profile.

outputs:
  cache-hit:
    description: A boolean value to indicate if a cache was hit.
    value: ${{ steps.setup-node.outputs.cache-hit }}
  cache-primary-key:
    description: The key used to restore and save the cache.
    value: ${{ steps.setup-node.outputs.cache-primary-key }}
  cache-matched-key:
    description: The key of the cache that was restored. Empty when no cache is found.
    value: ${{ steps.setup-node.outputs.cache-matched-key }}
  node-version:
    description: The installed node version.
    value: ${{ steps.node-version.outputs.node-version }}
  nono-version:
    description: The installed nono version.
    value: ${{ steps.nono-version.outputs.nono-version }}

runs:
  using: composite
  steps:
    # Pinned versions are cached by version. "latest" (or empty) is never
    # cached, since it would otherwise stay stuck on the first release seen.
    - name: Cache nono
      id: cache-nono
      if: inputs.nono-version != '' && inputs.nono-version != 'latest'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/nono-bin
        key: nono-${{ runner.os }}-${{ runner.arch }}-${{ inputs.nono-version }}

    - name: Install nono
      if: steps.cache-nono.outputs.cache-hit != 'true'
      shell: bash
      env:
        INPUT_NONO_VERSION: ${{ inputs.nono-version }}
      run: |
        set -euo pipefail

        install_dir="${RUNNER_TEMP}/nono-bin"
        mkdir -p "$install_dir"

        export NONO_INSTALL_DIR="$install_dir"
        if [ -n "$INPUT_NONO_VERSION" ] && [ "$INPUT_NONO_VERSION" != "latest" ]; then
          export NONO_VERSION="$INPUT_NONO_VERSION"
        fi

        curl -fsSL https://nono.sh/install.sh | sh

    - name: Add nono to PATH
      id: nono-version
      shell: bash
      run: |
        echo "${RUNNER_TEMP}/nono-bin" >> "$GITHUB_PATH"
        version_output="$("${RUNNER_TEMP}/nono-bin/nono" --version)"
        echo "$version_output"
        # `nono --version` prints "nono <version>"; keep only the version.
        echo "nono-version=${version_output##* }" >> "$GITHUB_OUTPUT"

    # `uses:` cannot take an expression, so to make the actions/setup-node
    # version configurable we check it out at the requested ref and run it as
    # a local action.
    - name: Fetch actions/setup-node
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: actions/setup-node
        ref: ${{ inputs.setup-node-version }}
        path: .nono-setup-node/setup-node
        persist-credentials: false

    - name: Setup Node.js
      id: setup-node
      uses: ./.nono-setup-node/setup-node
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        architecture: ${{ inputs.architecture }}
        check-latest: ${{ inputs.check-latest }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
        token: ${{ inputs.token }}
        always-auth: ${{ inputs.always-auth }}
        cache: ${{ inputs.cache }}
        package-manager-cache: ${{ inputs.package-manager-cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        mirror: ${{ inputs.mirror }}
        mirror-token: ${{ inputs.mirror-token }}

    - name: Create nono profile
      id: nono-profile
      shell: bash
      env:
        INPUT_NONO_PROFILE: ${{ inputs.nono-profile }}
        INPUT_NONO_PROFILE_FILE: ${{ inputs.nono-profile-file }}
      run: |
        set -euo pipefail

        if [ -n "$INPUT_NONO_PROFILE" ] && [ -n "$INPUT_NONO_PROFILE_FILE" ]; then
          echo "::error::The inputs nono-profile and nono-profile-file are mutually exclusive"
          exit 1
        fi

        profile_dir="${RUNNER_TEMP}/nono-profiles"
        mkdir -p "$profile_dir"

        if [ -n "$INPUT_NONO_PROFILE_FILE" ]; then
          # Relative paths are resolved against the workspace.
          case "$INPUT_NONO_PROFILE_FILE" in
            /*) profile_file="$INPUT_NONO_PROFILE_FILE" ;;
            *) profile_file="${GITHUB_WORKSPACE}/${INPUT_NONO_PROFILE_FILE}" ;;
          esac
          if [ ! -f "$profile_file" ]; then
            echo "::error::nono-profile-file not found: $profile_file"
            exit 1
          fi
        else
          profile_file="${profile_dir}/node-ci.json"
          if [ -n "$INPUT_NONO_PROFILE" ]; then
            printf '%s\n' "$INPUT_NONO_PROFILE" > "$profile_file"
          else
            cat > "$profile_file" <<'EOF'
        {
          "meta": {
            "name": "node-ci",
            "version": "1.0.0",
            "description": "Node.js CI with controlled access"
          },
          "groups": {
            "include": ["node_runtime"]
          },
          "filesystem": {
            "allow": ["$HOME/.npm"],
            "read_file": ["$HOME/.gitconfig"]
          },
          "workdir": { "access": "readwrite" },
          "interactive": false
        }
        EOF
          fi
        fi

        echo "nono profile: $profile_file"
        echo "profile-file=${profile_file}" >> "$GITHUB_OUTPUT"

    - name: Create nono shims for node, npm and yarn
      shell: bash
      env:
        NONO_PROFILE_FILE: ${{ steps.nono-profile.outputs.profile-file }}
      run: |
        set -euo pipefail

        shim_dir="${RUNNER_TEMP}/nono-shims"
        mkdir -p "$shim_dir"

        for tool in node npm yarn; do
          # Resolve the real binary now (before the shim dir is on PATH) so
          # the shim calls it by absolute path and never recurses.
          real="$(command -v "$tool")"
          cat > "${shim_dir}/${tool}" <<EOF
        #!/usr/bin/env bash
        # NONO_ARGS is read when the shim runs; intentionally unquoted so it word-splits.
        # shellcheck disable=SC2086
        exec nono run --profile "${NONO_PROFILE_FILE}" \${NONO_ARGS:---allow-cwd} -- "${real}" "\$@"
        EOF
          chmod +x "${shim_dir}/${tool}"
        done

        echo "$shim_dir" >> "$GITHUB_PATH"

    # A separate step so the shim dir added to GITHUB_PATH above is already on
    # PATH and `node` resolves to the shim without invoking it by path.
    - name: Get node version
      id: node-version
      shell: bash
      run: |
        set -euo pipefail
        node_version="$(node --version)"
        echo "node version: $node_version"
        echo "node-version=${node_version}" >> "$GITHUB_OUTPUT"
